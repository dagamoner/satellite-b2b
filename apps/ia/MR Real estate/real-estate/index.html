<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MR Real Estate · CENI Constructora — Florianópolis</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Montserrat:wght@300;400;500;600;700&family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ─── SCROLLBAR GLOBAL COLOR #33E8FF ──────────────────────── */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: rgba(10,30,60,0.08); border-radius: 4px; }
    ::-webkit-scrollbar-thumb { background: #33E8FF; border-radius: 4px; box-shadow: 0 0 6px rgba(51,232,255,0.5); }
    ::-webkit-scrollbar-thumb:hover { background: #33E8FF; box-shadow: 0 0 12px rgba(51,232,255,0.9); }
    * { scrollbar-width: thin; scrollbar-color: #33E8FF rgba(10,30,60,0.08); }

    /* ─── NEW TOP NAV & TABS ───────────────────────────────────── */
    .top-nav {
      position: absolute;
      top: 4%;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .tabs-bar {
      display: flex;
      gap: 20px;
      margin-bottom: 2%;
    }
    .tab {
      padding: 8px 2vw;
      background: rgba(10,30,60,0.4);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(201,168,76,0.3);
      border-radius: 30px;
      color: rgba(255,255,255,0.8);
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(10px, 1vw, 14px);
      font-weight: 600;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .tab:hover {
      background: rgba(51, 232, 255, 0.15);
      color: #33e8ff;
      border-color: #33e8ff;
      box-shadow: 0 0 15px rgba(51, 232, 255, 0.4);
    }
    .tab.active {
      background: rgba(51, 232, 255, 0.25);
      color: #33e8ff;
      border-color: #33e8ff;
      box-shadow: 0 0 25px rgba(51, 232, 255, 0.6);
      transform: scale(1.6);
      margin: 0 2vw;
      font-weight: 700;
      z-index: 10;
    }
    
    /* ─── NEW IMAGE TABS STYLES ─── */
    .img-tab-container {
      background: transparent !important;
      border: none !important;
      padding: 0 !important;
      box-shadow: none !important;
      margin: 0 !important;
      transform: none !important;
      display: flex;
      justify-content: center;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }
    .img-tab-container img {
      width: 100%;
      max-width: 240px;
      height: auto;
      transition: all 0.3s ease;
      filter: drop-shadow(0 0 5px rgba(51, 232, 255, 0.3));
    }
    .img-tab-container:hover img {
      transform: scale(1.05);
      filter: drop-shadow(0 0 15px rgba(51, 232, 255, 0.8));
    }
    .img-tab-container.active {
      transform: none !important;
    }
    .img-tab-container.active img {
      transform: scale(1.15);
      filter: drop-shadow(0 0 25px rgba(51, 232, 255, 1));
    }
    
    /* ─── PROYECTOS VIEW CSS ───────────────────────────────────── */
    .view-container {
      display: none;
      width: 100%;
    }
    .view-container.active-view {
      display: block;
    }
    /* ─── FONDOS POR VISTA ───────────────────────────────────────── */

    /* INICIO: fondo negro puro */
    body, .slide {
      background: #000 !important;
    }

    /* Cuando NO estamos en inicio → fondo Floripa como watermark claro */
    body.floripa-active .slide {
      background: #f4f6f9 !important; /* Fondo claro para dar efecto gota de agua */
    }
    body.floripa-active .slide::before {
      content: '';
      position: absolute;
      inset: 0;
      background: url('Imagen Floripa.png') center/cover no-repeat;
      opacity: 0.18; /* Efecto gota de agua bien clara */
      z-index: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }

    /* Ocultar los viejos overlays en vistas no-inicio */
    body.floripa-active .bg-top,
    body.floripa-active .bg-image,
    body.floripa-active .overlay-top,
    body.floripa-active .overlay-bottom,
    body.floripa-active .overlay-left,
    body.floripa-active .overlay-center,
    body.floripa-active .accent-line,
    body.floripa-active .corner-deco,
    body.floripa-active .corner-deco-tl {
      opacity: 0 !important;
    }

    /* En INICIO ocultar los overlays tambien, fondo es negro limpio */
    .bg-top, .bg-image, .overlay-top, .overlay-bottom,
    .overlay-left, .overlay-center, .accent-line,
    .corner-deco, .corner-deco-tl {
      opacity: 0 !important;
    }
    
    .proyectos-grid {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 3%;
      width: 100%;
      height: 85vh;
      padding-top: 40px;
    }
    .proyecto-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 46%;
      height: 85%;
      gap: 40px;
    }
    .proyecto-title {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(14px, 1.2vw, 20px);
      font-weight: 800;
      letter-spacing: 0.1em;
      color: #FFFFFF;
      text-transform: uppercase;
      text-align: center;
      padding: 10px 30px;
      border: 2px solid rgba(255, 255, 255, 0.6);
      border-radius: 50px;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
      z-index: 10;
    }
    .proyecto-wrapper:hover .proyecto-title {
      background: #FFFFFF;
      color: #000000;
      border-color: #FFFFFF;
      box-shadow: 0 0 20px rgba(255,255,255,0.8);
    }
    
    /* Social/External Links in Top Corners */
    .social-link {
      position: absolute;
      top: 3%;
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 13px;
      color: #fff;
      z-index: 20;
      padding: 10px 18px;
      border-radius: 30px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.25);
      transition: all 0.3s ease;
      letter-spacing: 0.05em;
    }
    .social-left {
      background: linear-gradient(135deg, rgba(193,53,132,0.85) 0%, rgba(225,119,43,0.85) 50%, rgba(253,204,68,0.85) 100%);
      box-shadow: 0 4px 20px rgba(193,53,132,0.4);
    }
    .social-right {
      background: linear-gradient(135deg, rgba(29,67,143,0.85) 0%, rgba(29,100,180,0.85) 100%);
      box-shadow: 0 4px 20px rgba(29,67,143,0.4);
    }
    .social-link:hover {
      transform: scale(1.07) translateY(-2px);
      box-shadow: 0 8px 28px rgba(0,0,0,0.3);
      border-color: rgba(255,255,255,0.6);
    }
    .social-link span {
      text-shadow: 0 1px 3px rgba(0,0,0,0.4);
    }
    .proyecto-card {
      width: 100%;
      height: 100%;
      border-radius: 20px;
      animation: floatUpDown 6s ease-in-out infinite;
      transition: box-shadow 0.5s ease, transform 0.5s ease;
      position: relative;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .proyecto-wrapper:nth-child(2) .proyecto-card {
      animation-delay: 1.5s;
    }
    @keyframes floatUpDown {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-25px); }
    }
    .proyecto-card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 12px;
    }
    .proyecto-card:hover {
      box-shadow: 0 0 50px rgba(51, 232, 255, 0.7), 0 0 100px rgba(51, 232, 255, 0.4);
    }
    
    /* ─── INNER VIEW CSS (MAR DO NORTE) ────────────────────────── */
    .inner-tabs-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 1%;
      margin-bottom: 2%;
    }
    .inner-tab {
      padding: 8px 24px;
      background: rgba(10,30,60,0.05);
      border: 1px solid rgba(10,30,60,0.15);
      border-radius: 20px;
      color: #0a1e46;
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(10px, 0.9vw, 14px);
      font-weight: 600;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
    }
    .inner-tab.active, .inner-tab:hover {
      background: rgba(51, 232, 255, 0.15);
      border-color: #33e8ff;
      box-shadow: 0 0 10px rgba(51, 232, 255, 0.4);
    }
    .inner-content {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .inner-view {
      display: none;
      width: 96%;
      max-width: 1400px;
      animation: fadeIn 0.5s ease;
    }
    .inner-view.active-inner {
      display: block;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .top-images-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      width: 100%;
      gap: 4%;
    }
    .top-image-wrapper {
      flex: 1;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(201,168,76,0.25);
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      background: rgba(0,0,0,0.2);
    }
    .top-image-wrapper img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.5s ease;
    }
    .top-image-wrapper:hover img {
      transform: scale(1.03);
    }

    /* ─── SCROLL HINT / PARTICLES ───────────────────────────────── */
    .particle {
      position: absolute;
      border-radius: 50%;
      background: var(--gold2);
      opacity: 0;
      animation: rise 6s ease-in infinite;
    }
    @keyframes rise {
      0%   { opacity: 0; transform: translateY(0) scale(1); }
      10%  { opacity: 0.6; }
      90%  { opacity: 0.2; }
      100% { opacity: 0; transform: translateY(-80px) scale(0.3); }
    }

  </style>
</head>

  <style>
    @keyframes spinAxis { 0% { transform: rotateX(-15deg) rotateY(0deg); } 100% { transform: rotateX(-15deg) rotateY(360deg); } }
    @keyframes spinCounterMR { 0% { transform: rotateY(0deg) rotateX(15deg); } 100% { transform: rotateY(-360deg) rotateX(15deg); } }
    @keyframes spinCounterCENI { 0% { transform: rotateY(-180deg) rotateX(15deg); } 100% { transform: rotateY(-540deg) rotateX(15deg); } }
    @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }

  </style>

  <script>
    // Función para ocultar el splash
    function hideSplash() {
      const splash = document.getElementById('splash-screen-new');
      if (splash && splash.style.visibility !== 'hidden') {
        splash.style.opacity = '0';
        splash.style.visibility = 'hidden';
        splash.style.pointerEvents = 'none';
      }
    }

    // 1. Ocultar a los 4s desde que el DOM está listo (no espera videos/PDFs)
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(hideSplash, 4000);
    });

    // 2. Seguro absoluto: ocultar a los 6s sin importar nada
    setTimeout(hideSplash, 6000);

    // 3. Click en el splash lo cierra inmediatamente (UX de emergencia)
    document.addEventListener('DOMContentLoaded', () => {
      const splash = document.getElementById('splash-screen-new');
      if (splash) {
        splash.addEventListener('click', hideSplash);
      }
    });
  </script>

<script>
  function switchView(viewId) {
    // ── Actualizar tabs activos ──
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));

    if (viewId === 'home-view') {
      document.getElementById('tab-inicio').classList.add('active');
      // INICIO: fondo negro puro, sin Floripa
      document.body.classList.remove('floripa-active');
    } else if (viewId === 'ceni-view') {
      document.getElementById('tab-ceni').classList.add('active');
      document.body.classList.add('floripa-active');
    } else if (viewId === 'alanzar-view') {
      document.getElementById('tab-alanzar').classList.add('active');
      document.body.classList.add('floripa-active');
    } else {
      document.getElementById('tab-proyectos').classList.add('active');
      document.body.classList.add('floripa-active');
    }

    // ── Mostrar la vista correcta ──
    document.querySelectorAll('.view-container').forEach(v => v.classList.remove('active-view'));
    document.getElementById(viewId).classList.add('active-view');

    // (El botón Regresar ahora siempre está visible, manejado en HTML)
  }

  function goBack() {
    const currentView = document.querySelector('.view-container.active-view');
    if (!currentView) return;
    
    if (currentView.id === 'mar-do-norte-view' || currentView.id === 'beriyth-view') {
      switchView('proyectos-view');
    } else {
      switchView('home-view');
    }
  }

  function switchInnerView(innerViewId, tabId) {
    // Hide all sibling views
    const view = document.getElementById(innerViewId);
    if (!view) return;
    const siblings = view.parentElement.querySelectorAll('.inner-view');
    siblings.forEach(v => v.classList.remove('active-inner'));
    view.classList.add('active-inner');

    // Update sibling tabs
    const tab = document.getElementById(tabId);
    if (tab) {
      const tabSiblings = tab.parentElement.querySelectorAll('.inner-tab');
      tabSiblings.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
    }
  }

  function toggleFullScreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log(`Error attempting to enable fullscreen: ${err.message}`);
      });
    } else {
      document.exitFullscreen();
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    const ceni          = document.querySelector('.ceni-pill');
    const mr            = document.querySelector('.mr-logo-wrap');
    const topBar        = document.querySelector('.top-bar');
    const planeMotion   = document.getElementById('plane-motion');


    // ── FLIGHT PATH INTERACTION ──
    if (ceni && mr && topBar) {
      ceni.addEventListener('click', (e) => {
        e.stopPropagation();
        const isActivating = !topBar.classList.contains('selected-active');
        if (isActivating) {
          topBar.classList.add('selected-active');
          ceni.classList.add('selected');
          mr.classList.add('selected');
          if (planeMotion) planeMotion.beginElement();
        } else {
          topBar.classList.remove('selected-active');
          ceni.classList.remove('selected');
          mr.classList.remove('selected');
        }
      });
      mr.addEventListener('click', (e) => { e.stopPropagation(); ceni.click(); });
      document.querySelector('.slide').addEventListener('click', () => {
        topBar.classList.remove('selected-active');
        ceni.classList.remove('selected');
        mr.classList.remove('selected');
      });
    }
  });
</script>

<script>
  const translations = {
    es: {
      volver: "VOLVER",
      web_ceni: "WEB CENI"
    },
    pt: {
      volver: "VOLTAR",
      web_ceni: "SITE CENI"
    }
  };

  const imgTranslations = {
    es: {
      "Solapa_INICIO_Br.png": "Solapa_INICIO.png",
      "Solapa_CENI_Br.png": "Solapa_CENI.png",
      "Solapa_PROYECTOS_Br.png": "Solapa_PROYECTOS.png",
      "Solapa_LANZAMIENTOS_Br.png": "Solapa_LANZAMIENTOS.png",
      "Solapa_Presentacion_Comercial_Br.png": "Solapa_Presentacion_Comercial.png"
    },
    pt: {
      "Solapa_INICIO.png": "Solapa_INICIO_Br.png",
      "Solapa_CENI.png": "Solapa_CENI_Br.png",
      "Solapa_PROYECTOS.png": "Solapa_PROYECTOS_Br.png",
      "Solapa_LANZAMIENTOS.png": "Solapa_LANZAMIENTOS_Br.png",
      "Solapa_Presentacion_Comercial.png": "Solapa_Presentacion_Comercial_Br.png"
    }
  };

  let isFirstLoad = true;

  function setLang(lang) {
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (translations[lang] && translations[lang][key]) {
        el.innerText = translations[lang][key];
      }
    });

    // Translate Images
    const currentDict = imgTranslations[lang];
    document.querySelectorAll('img').forEach(img => {
      let src = img.getAttribute('src');
      if (currentDict[src]) {
        img.setAttribute('src', currentDict[src]);
      }
    });

    // Visual update for flags (Agrandar al doble y difuminar por atrás)
    const flagEs = document.getElementById('flag-es');
    const flagPt = document.getElementById('flag-pt');
    const welcomeMessage = document.getElementById('welcome-message');
    
    if (lang === 'es') {
      flagEs.style.background = 'rgba(255,255,255,0.1)';
      flagEs.style.borderColor = 'rgba(255,255,255,0.3)';
      flagEs.style.boxShadow = '0 0 20px rgba(51, 232, 255, 0.8)';
      flagEs.style.transform = 'scale(1.8)';
      flagEs.style.margin = '0 10px';
      
      flagPt.style.background = 'transparent';
      flagPt.style.borderColor = 'transparent';
      flagPt.style.boxShadow = 'none';
      flagPt.style.transform = 'scale(1)';
      flagPt.style.margin = '0';
      
      if (!isFirstLoad && welcomeMessage) {
        welcomeMessage.innerHTML = '<span style="color: #75AADB;">BIENVENIDO</span> <span style="color: #FFFFFF;">!!!</span>';
        welcomeMessage.style.opacity = '1';
        setTimeout(() => { welcomeMessage.style.opacity = '0'; }, 2000);
      }
    } else {
      flagPt.style.background = 'rgba(255,255,255,0.1)';
      flagPt.style.borderColor = 'rgba(255,255,255,0.3)';
      flagPt.style.boxShadow = '0 0 20px rgba(0, 255, 0, 0.8)';
      flagPt.style.transform = 'scale(1.8)';
      flagPt.style.margin = '0 10px';
      
      flagEs.style.background = 'transparent';
      flagEs.style.borderColor = 'transparent';
      flagEs.style.boxShadow = 'none';
      flagEs.style.transform = 'scale(1)';
      flagEs.style.margin = '0';
      
      if (!isFirstLoad && welcomeMessage) {
        welcomeMessage.innerHTML = '<span style="color: #009B3A;">Bem-vindo</span> <span style="color: #FEDF00;">!!!!!</span>';
        welcomeMessage.style.opacity = '1';
        setTimeout(() => { welcomeMessage.style.opacity = '0'; }, 2000);
      }
    }
  }

  // Initialize correct state on load
  document.addEventListener('DOMContentLoaded', () => {
    setLang('es');
    isFirstLoad = false;
  });
</script>

</body>
</html>
